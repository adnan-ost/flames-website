<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <filter id="ash-clouds" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.024" numOctaves="4" seed="31" result="clouds"/>
      <feGaussianBlur in="clouds" stdDeviation="2.2" result="soft-clouds"/>
      <feColorMatrix in="soft-clouds" type="matrix" values="
        .34 .34 .34 0 .12
        .34 .34 .34 0 .11
        .34 .34 .34 0 .10
        0 0 0 .34 0"/>
    </filter>
    <filter id="ash-dust">
      <feTurbulence type="fractalNoise" baseFrequency="0.38" numOctaves="2" seed="17" result="dust"/>
      <feColorMatrix in="dust" type="matrix" values="
        .33 .33 .33 0 .18
        .33 .33 .33 0 .17
        .33 .33 .33 0 .16
        0 0 0 .12 0"/>
    </filter>
  </defs>
  <rect width="1200" height="900" filter="url(#ash-clouds)"/>
  <rect width="1200" height="900" filter="url(#ash-dust)" opacity=".55"/>
</svg>
